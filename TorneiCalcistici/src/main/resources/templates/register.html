<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
    <title>Registrazione</title>
    <style>
        :root {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #111827;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }
        .form-panel {
            width: min(420px, calc(100vw - 2rem));
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
            padding: 2rem;
            display: grid;
            gap: 1rem;
        }
        .form-panel h1 {
            margin: 0;
            font-size: 1.9rem;
            font-weight: 700;
        }
        .field {
            display: grid;
            gap: 0.65rem;
        }
        .field input,
        .field select {
            width: 100%;
            border: 1px solid #d2d6dc;
            border-radius: 16px;
            padding: 0.95rem 1rem;
            background: #f8fafc;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
            background: #ffffff;
        }
        .actions {
            display: grid;
            gap: 0.75rem;
        }
        .button,
        .secondary {
            width: 100%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 1.1rem;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid transparent;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .button {
            background: #111827;
            color: #ffffff;
        }
        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(17, 24, 39, 0.18);
        }
        .secondary {
            background: #eff2ff;
            color: #1f2937;
        }
        .secondary:hover {
            background: #e0e7ff;
        }
        .footer {
            text-align: center;
            font-size: 0.95rem;
            color: #6b7280;
        }
        .footer a {
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <section class="form-panel">
        <h1>Registrazione</h1>
        <form th:action="@{/register}" method="post" class="field">
            <input type="text" name="username" placeholder="Username" required autocomplete="username">
            <input type="password" name="password" placeholder="Password" required autocomplete="new-password">
            <select name="role" required>
                <option value="ROLE_DEFAULT">USER</option>
                <option value="ROLE_ADMIN">ADMIN</option>
            </select>
            <div class="actions">
                <button type="submit" class="button">Conferma</button>
                <a href="/login" class="secondary">Torna al login</a>
            </div>
        </form>
        <div class="footer">Già registrato? <a href="/login">Accedi qui</a></div>
    </section>
</body>
</html>
