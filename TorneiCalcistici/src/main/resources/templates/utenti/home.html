<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home utente</title>
    <style>
        :root {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #111827;
            background: #f5f7fb;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }
        .card {
            width: min(520px, 100%);
            background: #ffffff;
            border-radius: 28px;
            padding: 2rem;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
            display: grid;
            gap: 1.5rem;
        }
        .hero {
            display: grid;
            gap: 0.4rem;
        }
        .hero h1 {
            margin: 0;
            font-size: 2rem;
            line-height: 1.1;
        }
        .hero p {
            margin: 0;
            color: #6b7280;
            font-size: 1rem;
        }
        .actions {
            display: grid;
            gap: 0.85rem;
        }
        .actions a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .primary {
            background: #111827;
            color: #ffffff;
        }
        .primary:hover {
            transform: translateY(-1px);
            background: #1f2937;
        }
        .secondary {
            background: #eff2ff;
            color: #1f2937;
        }
        .secondary:hover {
            background: #e0e7ff;
        }
        .admin-link {
            justify-self: start;
            color: #4f46e5;
            font-weight: 700;
        }
        .admin-link:hover {
            text-decoration: underline;
        }
    </style>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
    <title> Home </title>

</head>
<body>
    <section class="card">
        <div class="hero">
            <h1>Benvenuto <span th:text="${auth.name}">Utente</span></h1>
        </div>
        <div class="actions">
            <a href="/tornei" class="primary">Visualizza Tornei</a>
            <a href="/logout" class="secondary">Logout</a>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')" href="/admin" class="admin-link">Admin</a>
        </div>
    </section>
</body>
</html>
